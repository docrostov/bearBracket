<!--
  Paste into Supabase Dashboard > Authentication > Emails > Magic Link > Source.
  Subject line to set alongside it: 🐻 Your bearBracket sign-in link
-->
<div style="background-color:#CDB49A;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background-color:#E8DAC0;border-radius:16px;border:1px solid #B99B74;overflow:hidden;">
    <div style="background-color:#CAAB8E;padding:24px;text-align:center;">
      <img src="https://bearbracket.com/transbearant.png" width="56" height="56" alt="bearBracket" style="display:block;margin:0 auto 8px;border:0;" />
      <div style="font-size:20px;font-weight:700;color:#34190E;">bearBracket</div>
    </div>
    <div style="padding:32px 28px;text-align:center;">
      <h1 style="margin:0 0 12px;font-size:20px;color:#34190E;">Your sign-in link 🐻</h1>
      <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#5B3D22;">
        Follow the link below to sign back in to bearBracket.
      </p>
      <p style="margin:0 0 20px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#34190E;color:#F4E9D8;text-decoration:none;padding:12px 28px;border-radius:999px;font-size:14px;font-weight:600;">
          Sign in
        </a>
      </p>
      <p style="margin:0;font-size:12px;color:#8C7357;">
        This link expires shortly and can only be used once.
      </p>
    </div>
  </div>
</div>
